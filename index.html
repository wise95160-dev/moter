        <!-- ③ 전류의 세기 조절 (초기값 0 OFF, 연속 슬라이드바) -->
        <div class="bg-white border border-slate-200 rounded-2xl p-2.5 shadow-sm">

            <div class="flex justify-between text-[10px] font-bold text-slate-500 mt-1 px-0.5">
              <span onclick="setCurrentLevel(0)" class="cursor-pointer hover:text-slate-900">OFF</span>
              <span onclick="setCurrentLevel(1)" class="cursor-pointer hover:text-slate-900">미약</span>

        <!-- 👁️ 표시 옵션 (사각형들 높이 70%로 축소) -->
        <div class="bg-white border border-slate-200 rounded-2xl p-2 space-y-1 shadow-sm">
          <div class="text-xs font-black text-slate-800 mb-0.5">👁️ 표시 옵션</div>

          </label>

            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">💚 힘 화살표(연두색) 표시</span>
          </label>

            <input type="checkbox" id="chkMagneticField" onchange="state.showMagneticField = this.checked" class="accent-sky rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">🧲 자석·코일 자기력선 상호작용 표시</span>

      </div>

  </div>

  <!-- ================= 4. 시뮬레이션 엔진 스크립트 ================= -->
  <script>
    const LEVEL_TO_AMP = { 0: 0, 1: 1.5, 2: 5.0, 3: 11.0, 4: 18.0, 5: 28.0 };
    const LEVEL_LABELS = { 0: '0 OFF', 1: '1 미약', 2: '2 약', 3: '3 중', 4: '4 강', 5: '5 초강' };

    const state = {
      isPlaying: false,
      switchOn: false,
      currentLevel: 0,
      currentAmp: 0,
      batteryPolarity: 1,
      statorPolarity: 1,
      commutatorAutoFlip: true,
      instantCurrent: 0,
      coilAngle: (35 * Math.PI) / 180,
      angularVel: 0,
      wireArrowPhase: 0,
      flipFlashTimer: 0,
      showRightHand: false,
      showMagneticField: false,
      showPoleColors: false,
      showGreenForceArrows: false,
      showPinkCenterArrow: false,
      showCallouts: true,
      settingsOpen: true
    };

    const canvas = document.getElementById('motorCanvas');
    const ctx = canvas.getContext('2d');

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const radius = typeof r === 'number' ? r : 8;
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        this.closePath();
        return this;
      };
    }

    function resizeCanvas() {
      const stageBox = document.getElementById('stageBox');
      if (!stageBox || !canvas) return;
      const rect = stageBox.getBoundingClientRect();
      canvas.width = Math.max(320, Math.floor(rect.width));
      canvas.height = Math.max(240, Math.floor(rect.height));
    }

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        rotateCoilByStep(-15);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        rotateCoilByStep(15);
      }
    });

    function updatePhysics(dt) {
      let iExt = 0;
      if (!state.switchOn || state.currentLevel === 0 || state.currentAmp === 0) {
        iExt = 0;
      } else {
        iExt = state.currentAmp * state.batteryPolarity;
      }
      state.instantCurrent = iExt;

      const normAngle = ((state.coilAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const inSecondHalf = normAngle >= Math.PI;
      const commFactor = state.commutatorAutoFlip ? (inSecondHalf ? -1 : 1) : 1;
      const iCoilLocal = iExt * commFactor;

      let endAPole = 0;
      if (Math.abs(iCoilLocal) > 0.08) {
        endAPole = iCoilLocal >= 0 ? 1 : -1;
      }

      if (Math.abs(iCoilLocal) > 0.08) {
        const arrowSpeed = (iCoilLocal / 5.0) * 1.45 * (state.isPlaying ? 1.0 : 0.45);
        state.wireArrowPhase = ((state.wireArrowPhase + arrowSpeed * dt) % 1 + 1) % 1;
      }

      if (state.isPlaying) {
        if (Math.abs(iExt) < 0.08) {
          state.angularVel *= Math.pow(0.05, dt);
        } else if (state.commutatorAutoFlip) {
          const prevHalf = Math.floor(normAngle / Math.PI);
          const rotDir = state.batteryPolarity * state.statorPolarity;
          const baseOmega = 0.22 + (state.currentAmp / 10.0) * 1.6;
          const targetVel = rotDir * baseOmega;
          state.angularVel += (targetVel - state.angularVel) * Math.min(1, dt * 10.0);
          state.coilAngle += state.angularVel * dt;

          const newNorm = ((state.coilAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          if (Math.floor(newNorm / Math.PI) !== prevHalf) {
            state.flipFlashTimer = 0.7;
          }
        } else {
          const attractAngle = (endAPole * state.statorPolarity > 0) ? Math.PI : 0;
          let diff = attractAngle - normAngle;
          if (diff > Math.PI) diff -= Math.PI * 2;
          if (diff < -Math.PI) diff += Math.PI * 2;
          const pullTorque = diff * (2.8 + state.currentAmp * 1.1);
          state.angularVel += pullTorque * dt;
          state.angularVel *= Math.pow(0.1, dt);
          state.coilAngle += state.angularVel * dt;
        }
      } else {
        state.angularVel = 0;
      }

      if (state.flipFlashTimer > 0) {
        state.flipFlashTimer = Math.max(0, state.flipFlashTimer - dt);
      }

      syncAngleUI(normAngle);

      return { endAPole, iCoilLocal, normAngle };
    }

    function syncAngleUI(normAngle) {
      const deg = Math.round((normAngle * 180) / Math.PI) % 360;
      const slider = document.getElementById('angleSlider');
      if (slider && document.activeElement !== slider) slider.value = deg;
    }

    function renderTextbookMotor(phys) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // 크롬북 화면에서 전동기 움직임이 큼직하고 선명하게 보이도록 화면 비율 최적화
      const baseW = state.showCallouts ? 780 : 690;
      const baseH = 340;
      const scale = Math.min(w / baseW, h / baseH) * 0.98;

      ctx.save();
      ctx.translate(w / 2, h / 2 + 8);
      ctx.scale(scale, scale);

      drawTextbookStatorMagnets();

      if (state.showMagneticField) {
        drawStatorMagneticField(false, phys);
      }

      drawTextbookCoilAndCurrentArrows(phys);

      if (state.showMagneticField) {
        drawStatorMagneticField(true, phys);
      }

      if (state.showGreenForceArrows && phys.endAPole !== 0) {
        drawGreenForceArrows(phys);
      }

      if (state.showRightHand) {
        drawTextbookRightHandOverlay(phys);
      }

      if (state.showCallouts) {
        drawTextbookCallouts();
      }

      ctx.restore();
    }

    function drawTextbookStatorMagnets() {
      const leftIsN = state.statorPolarity > 0;
      const leftFill = leftIsN ? '#E65132' : '#5496D4';
      const leftStroke = leftIsN ? '#9E2412' : '#274F7D';
      const leftLabel = leftIsN ? 'N' : 'S';
      const rightFill = leftIsN ? '#5496D4' : '#E65132';
      const rightStroke = leftIsN ? '#274F7D' : '#9E2412';
      const rightLabel = leftIsN ? 'S' : 'N';

      const outerX = 335;
      const innerTipX = 228;
      const topY = -140;
      const botY = 140;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-outerX, topY);
      ctx.lineTo(-innerTipX, topY);
      ctx.quadraticCurveTo(-innerTipX - 42, 0, -innerTipX, botY);
      ctx.lineTo(-outerX, botY);
      ctx.closePath();
      ctx.fillStyle = leftFill;
      ctx.fill();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = leftStroke;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 44px "Pretendard", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(leftLabel, -292, 4);
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(outerX, topY);
      ctx.lineTo(innerTipX, topY);
      ctx.quadraticCurveTo(innerTipX + 42, 0, innerTipX, botY);
      ctx.lineTo(outerX, botY);
      ctx.closePath();
      ctx.fillStyle = rightFill;
      ctx.fill();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = rightStroke;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 44px "Pretendard", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(rightLabel, 292, 4);
      ctx.restore();
    }

    function drawStatorMagneticField(isForeground, phys) {
      const endAPole = phys ? phys.endAPole : 0;
      const normAngle = phys ? phys.normAngle : 0;
      const statorPol = state.statorPolarity >= 0 ? 1 : -1;
      const cosA = Math.cos(state.coilAngle);
      const sinA = Math.sin(state.coilAngle);

      if (endAPole === 0) {
        const yLines = [-104, -52, 0, 52, 104];
        ctx.save();
        if (!isForeground) {
          ctx.strokeStyle = 'rgba(2, 132, 199, 0.58)';
          ctx.lineWidth = 2.6;
          yLines.forEach(y => {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            ctx.beginPath();
            ctx.moveTo(-xEdge, y);
            ctx.lineTo(xEdge, y);
            ctx.stroke();
          });
        } else {
          yLines.forEach(y => {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            ctx.save();
            ctx.strokeStyle = 'rgba(2, 132, 199, 0.25)';
            ctx.lineWidth = 2.0;
            ctx.setLineDash([7, 7]);
            ctx.beginPath();
            ctx.moveTo(-xEdge, y);
            ctx.lineTo(xEdge, y);
            ctx.stroke();
            ctx.restore();
            [-195, 0, 195].forEach((ax, idx) => {
              drawFieldArrowhead(ax, y, statorPol > 0 ? 0 : Math.PI, idx === 1 ? 'rgba(2, 132, 199, 0.45)' : '#0284c7', idx !== 1);
            });
          });
          drawMagneticFieldBanner('🧲 양쪽 자석의 자기력선 (전류 OFF : N극 ➔ S극)', '#0284c7', '#f0f9ff', '#0369a1');
        }
        ctx.restore();
        return;
      }

      if (!isForeground) {
        const ampRatio = 0.6 + 0.45 * (Math.min(28, Math.abs(state.instantCurrent)) / 28);
        const poleSources = [];
        for (let m = 0; m < 9; m++) {
          const ym = -116 + 29 * m;
          const t = (ym + 140) / 280;
          const xInner = 228 + 84 * t * (1 - t);
          poleSources.push({ x: -xInner - 22, y: ym, q: statorPol * 1.45, r2: 750 });
          poleSources.push({ x: xInner + 22, y: ym, q: -statorPol * 1.45, r2: 750 });
        }

        for (let k = 0; k < 7; k++) {
          const vk = -66 + 22 * k;
          const uMax = 152 + 18 * (1 - (vk / 84) * (vk / 84));
          const uA = -uMax + 20;
          const uB = uMax - 20;
          const xA = uA * cosA - vk * sinA;
          const yA = uA * sinA + vk * cosA;
          const xB = uB * cosA - vk * sinA;
          const yB = uB * sinA + vk * cosA;
          poleSources.push({ x: xA, y: yA, q: endAPole * 1.65 * ampRatio, r2: 520 });
          poleSources.push({ x: xB, y: yB, q: -endAPole * 1.65 * ampRatio, r2: 520 });
        }

        function sampleCombinedField(x, y) {
          let bx = statorPol * 0.015;
          let by = 0;
          for (let i = 0; i < poleSources.length; i++) {
            const s = poleSources[i];
            const dx = x - s.x;
            const dy = y - s.y;
            const d2 = dx * dx + dy * dy + s.r2;
            const factor = s.q / (d2 * Math.sqrt(d2)) * 180;
            bx += dx * factor;
            by += dy * factor;
          }
          const u = x * cosA + y * sinA;
          const v = -x * sinA + y * cosA;
          if (Math.abs(u) < 138 && Math.abs(v) < 116) {
            const wu = Math.max(0, Math.min(1, (138 - Math.abs(u)) / 20));
            const wv = Math.max(0, Math.min(1, (116 - Math.abs(v)) / 30));
            const damp = wu * wv;
            let fu = bx * cosA + by * sinA;
            let fv = -bx * sinA + by * cosA;
            fv *= (1 - damp);
            if (Math.abs(fu) < 0.008) fu = (fu >= 0 ? 1 : -1) * 0.008;
            bx = fu * cosA - fv * sinA;
            by = fu * sinA + fv * cosA;
          }
          return { bx, by };
        }

        function hitMagnetOrCoilBoundary(x, y) {
          if (Math.abs(x) > 350 || Math.abs(y) > 205) return true;
          if (Math.abs(y) <= 140) {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            if (x <= -xEdge + 1 || x >= xEdge - 1) return true;
          }
          const u = x * cosA + y * sinA;
          const v = -x * sinA + y * cosA;
          if (Math.abs(v) <= 84) {
            const uMax = 152 + 18 * (1 - (v / 84) * (v / 84));
            if (Math.abs(u) <= uMax - 1 && Math.abs(u) >= 126) return true;
          }
          return false;
        }

        function traceFieldLine(startX, startY, traceDir, sourceTag) {
          const pts = [{ x: startX, y: startY }];
          let cx = startX;
          let cy = startY;
          const stepSize = 5.0;
          let prevUx = 0, prevUy = 0;

          for (let step = 0; step < 165; step++) {
            const f1 = sampleCombinedField(cx, cy);
            const m1 = Math.hypot(f1.bx, f1.by);
            if (m1 < 0.0012) break;
            const ux1 = (f1.bx / m1) * traceDir;
            const uy1 = (f1.by / m1) * traceDir;
            if (step > 0 && (ux1 * prevUx + uy1 * prevUy) < -0.25) break;

            const mx = cx + ux1 * (stepSize * 0.5);
            const my = cy + uy1 * (stepSize * 0.5);
            const f2 = sampleCombinedField(mx, my);
            const m2 = Math.hypot(f2.bx, f2.by);
            if (m2 < 0.0012) break;

            const ux2 = (f2.bx / m2) * traceDir;
            const uy2 = (f2.by / m2) * traceDir;
            cx += ux2 * stepSize;
            cy += uy2 * stepSize;
            pts.push({ x: cx, y: cy });
            prevUx = ux2;
            prevUy = uy2;
            if (step >= 3 && hitMagnetOrCoilBoundary(cx, cy)) break;
          }
          if (traceDir < 0) pts.reverse();
          return { pts, sourceTag };
        }

        const tracedLines = [];
        const statorN_XSign = statorPol > 0 ? -1 : 1;
        [-112, -75, -37, 0, 37, 75, 112].forEach(sy => {
          const t = (sy + 140) / 280;
          const xEdge = 228 + 84 * t * (1 - t);
          tracedLines.push(traceFieldLine(statorN_XSign * (xEdge - 3), sy, 1, 'stator'));
        });

        const coilN_USign = endAPole > 0 ? -1 : 1;
        [-68, -45, -22, 0, 22, 45, 68].forEach(sv => {
          const uMax = 152 + 18 * (1 - (sv / 84) * (sv / 84));
          const su = coilN_USign * (uMax + 3);
          const sx = su * cosA - sv * sinA;
          const sy = su * sinA + sv * cosA;
          if (!hitMagnetOrCoilBoundary(sx, sy)) {
            tracedLines.push(traceFieldLine(sx, sy, 1, 'coil'));
          }
        });

        function isNearExistingLine(px, py, minDist) {
          const d2Max = minDist * minDist;
          for (let i = 0; i < tracedLines.length; i++) {
            const pts = tracedLines[i].pts;
            for (let j = 0; j < pts.length; j += 2) {
              const dx = pts[j].x - px;
              const dy = pts[j].y - py;
              if (dx * dx + dy * dy < d2Max) return true;
            }
          }
          return false;
        }

        const statorS_XSign = -statorN_XSign;
        [-112, -75, -37, 0, 37, 75, 112].forEach(sy => {
          const t = (sy + 140) / 280;
          const xEdge = 228 + 84 * t * (1 - t);
          const sx = statorS_XSign * (xEdge - 3);
          if (!isNearExistingLine(sx, sy, 22)) {
            tracedLines.push(traceFieldLine(sx, sy, -1, 'stator'));
          }
        });

        [-68, -45, -22, 0, 22, 45, 68].forEach(sv => {
          const uMax = 152 + 18 * (1 - (sv / 84) * (sv / 84));
          const su = -coilN_USign * (uMax + 3);
          const sx = su * cosA - sv * sinA;
          const sy = su * sinA + sv * cosA;
          if (!hitMagnetOrCoilBoundary(sx, sy) && !isNearExistingLine(sx, sy, 20)) {
            tracedLines.push(traceFieldLine(sx, sy, -1, 'coil'));
          }
        });

        ctx.save();
        tracedLines.forEach(line => {
          const pts = line.pts;
          if (pts.length < 4) return;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.strokeStyle = line.sourceTag === 'coil' ? 'rgba(37, 99, 235, 0.78)' : 'rgba(2, 132, 199, 0.72)';
          ctx.lineWidth = line.sourceTag === 'coil' ? 2.7 : 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          const arrowIndices = pts.length > 26 ? [Math.floor(pts.length * 0.35), Math.floor(pts.length * 0.72)] : [Math.floor(pts.length * 0.52)];
          arrowIndices.forEach(idx => {
            if (idx > 0 && idx < pts.length - 1) {
              const pPrev = pts[idx - 1];
              const pNext = pts[idx + 1];
              const ang = Math.atan2(pNext.y - pPrev.y, pNext.x - pPrev.x);
              drawFieldArrowhead(pts[idx].x, pts[idx].y, ang, line.sourceTag === 'coil' ? '#2563eb' : '#0284c7', true);
            }
          });
        });
        ctx.restore();
      } else {
        ctx.save();
        ctx.rotate(state.coilAngle);
        const internalDir = endAPole > 0 ? -1 : 1;
        [-44, 0, 44].forEach(vLine => {
          ctx.save();
          ctx.strokeStyle = 'rgba(37, 99, 235, 0.26)';
          ctx.lineWidth = 2.0;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(-132, vLine);
          ctx.lineTo(132, vLine);
          ctx.stroke();
          ctx.restore();
          drawFieldArrowhead(internalDir * 52, vLine, internalDir > 0 ? 0 : Math.PI, 'rgba(37, 99, 235, 0.42)', false);
        });
        ctx.restore();

        const deg = (normAngle * 180) / Math.PI;
        const nearHorizontal = deg < 12 || deg > 348 || Math.abs(deg - 180) < 12;
        const leftEndPole = Math.cos(normAngle) >= 0 ? endAPole : -endAPole;
        const isRepulsion = (leftEndPole * statorPol) > 0;

        if (nearHorizontal) {
          drawMagneticFieldBanner('⚡ 전류 방향 전환 순간 : 코일의 N·S극과 자기력선 반전!', '#d97706', 'rgba(254, 243, 199, 0.94)', '#92400e');
        } else if (isRepulsion) {
          drawMagneticFieldBanner('🧲 자기력선 상호작용 : 같은 극끼리 서로 밀어내어 휘어짐 (척력 ↔)', '#4d7c0f', 'rgba(247, 254, 231, 0.94)', '#3f6212');
        } else {
          drawMagneticFieldBanner('🧲 자기력선 상호작용 : 다른 극(N➔S)끼리 연결되어 당김 (인력 ➔⬅)', '#0284c7', 'rgba(240, 249, 255, 0.94)', '#0369a1');
        }
      }
    }

    function drawFieldArrowhead(x, y, angleRad, fillColor, withStroke) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      ctx.beginPath();
      ctx.moveTo(8.5, 0);
      ctx.lineTo(-6.5, -5.8);
      ctx.lineTo(-3.8, 0);
      ctx.lineTo(-6.5, 5.8);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      if (withStroke) {
        ctx.lineWidth = 1.1;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

      ctx.restore();
    }

    function drawMagneticFieldBanner(text, borderColor, bgColor, textColor) {
      ctx.save();

      ctx.font = '700 13px "Pretendard", sans-serif';

      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(-boxW / 2, -14, boxW, 28, 14);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 1);
      ctx.restore();
    }

    function drawTextbookCoilAndCurrentArrows(phys) {
      const { endAPole } = phys;
      ctx.save();
      ctx.rotate(state.coilAngle);

      const halfLen = 152;
      const halfThick = 84;
      const wireXList = [-95, -57, -19, 19, 57, 95];
      const wireTilt = 14;

      wireXList.forEach(wx => {
        const topX = wx - wireTilt;
        const botX = wx + wireTilt;
        ctx.beginPath();
        ctx.arc(topX + 7, -halfThick, 10, Math.PI, 0, false);
        ctx.lineWidth = 8.5; ctx.strokeStyle = '#B88714'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 6; ctx.strokeStyle = '#DEB12A'; ctx.stroke();

        ctx.beginPath();
        ctx.arc(botX - 7, halfThick, 10, 0, Math.PI, false);
        ctx.lineWidth = 8.5; ctx.strokeStyle = '#B88714'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 6; ctx.strokeStyle = '#DEB12A'; ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(-halfLen, -halfThick);
      ctx.lineTo(halfLen, -halfThick);
      ctx.quadraticCurveTo(halfLen + 36, 0, halfLen, halfThick);
      ctx.lineTo(-halfLen, halfThick);
      ctx.quadraticCurveTo(-halfLen - 36, 0, -halfLen, -halfThick);
      ctx.closePath();

      if (endAPole === 0 || !state.showPoleColors) {
        ctx.fillStyle = '#CCCCCC';
      } else {
        const grad = ctx.createLinearGradient(-halfLen - 25, 0, halfLen + 25, 0);
        if (endAPole > 0) {
          grad.addColorStop(0.0, '#E65132'); grad.addColorStop(0.24, '#EB6E54');
          grad.addColorStop(0.42, '#CCCCCC'); grad.addColorStop(0.58, '#CCCCCC');
          grad.addColorStop(0.76, '#6BA5DC'); grad.addColorStop(1.0, '#4A8FD1');
        } else {
          grad.addColorStop(0.0, '#4A8FD1'); grad.addColorStop(0.24, '#6BA5DC');
          grad.addColorStop(0.42, '#CCCCCC'); grad.addColorStop(0.58, '#CCCCCC');
          grad.addColorStop(0.76, '#EB6E54'); grad.addColorStop(1.0, '#E65132');
        }
        ctx.fillStyle = grad;
      }
      ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = '#7F7F7F'; ctx.stroke();

      drawYellowStar(-halfLen + 22, -halfThick + 22, 11, 5);

      wireXList.forEach(wx => {
        const topX = wx - wireTilt;
        const botX = wx + wireTilt;
        ctx.beginPath();
        ctx.moveTo(topX, -halfThick - 2); ctx.lineTo(botX, halfThick + 2);
        ctx.lineWidth = 9.5; ctx.strokeStyle = '#B58410'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(topX, -halfThick - 2); ctx.lineTo(botX, halfThick + 2);
        ctx.lineWidth = 6.5; ctx.strokeStyle = '#E2B42B'; ctx.lineCap = 'round'; ctx.stroke();
      });

      if (endAPole !== 0) {
        const flowUpward = endAPole > 0;
        wireXList.forEach((wx, idx) => {
          const topX = wx - wireTilt;
          const botX = wx + wireTilt;
          const angle = flowUpward ? Math.atan2(-halfThick - halfThick, topX - botX) : Math.atan2(halfThick - (-halfThick), botX - topX);
          for (let k = 0; k < 2; k++) {
            let t = (state.wireArrowPhase + k / 2 + (idx % 2) * 0.15) % 1;
            if (!flowUpward) {
              const px = topX + (botX - topX) * t;
              const py = -halfThick + 22 + (halfThick * 2 - 44) * t;
              drawVividYellowCurrentArrow(px, py, angle);
            } else {
              const px = botX + (topX - botX) * t;
              const py = halfThick - 22 + (-halfThick * 2 + 44) * t;
              drawVividYellowCurrentArrow(px, py, angle);
            }
          }
        });

        if (state.showPoleColors) {
          ctx.save();
          ctx.translate(-halfLen + 18, 12); ctx.rotate(-state.coilAngle);
          ctx.fillStyle = '#FFFFFF'; ctx.font = '700 38px "Pretendard", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(endAPole > 0 ? 'N' : 'S', 0, 0);
          ctx.restore();

          ctx.save();
          ctx.translate(halfLen - 18, 12); ctx.rotate(-state.coilAngle);
          ctx.fillStyle = '#FFFFFF'; ctx.font = '700 38px "Pretendard", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(endAPole > 0 ? 'S' : 'N', 0, 0);
          ctx.restore();
        }

        if (state.showPinkCenterArrow) {
          const centerAngle = flowUpward ? Math.atan2(-halfThick - halfThick, -wireTilt * 2) : Math.atan2(halfThick - (-halfThick), wireTilt * 2);
          drawTextbookPinkCenterArrow(0, 0, centerAngle);
        }
      }
      ctx.restore();
    }

    function drawVividYellowCurrentArrow(x, y, angleRad) {
      ctx.save();
      ctx.translate(x, y);

      ctx.beginPath();
      // 화살표 길이를 2배로 확장 (기존 22 -> 44)
      ctx.moveTo(22, 0);
      ctx.lineTo(8, -12);
      ctx.lineTo(8, -5);
      ctx.lineTo(-22, -5);
      ctx.lineTo(-22, 5);
      ctx.lineTo(8, 5);
      ctx.lineTo(8, 12);
      ctx.closePath();
      ctx.fillStyle = '#FFEE00';
      ctx.fill();

    function drawGreenForceArrows(phys) {
      const { endAPole, normAngle } = phys;
      const deg = (normAngle * 180) / Math.PI;
      if (deg < 8 || deg > 352 || Math.abs(deg - 180) < 8) return;

      const endRadius = 158;
      const ax = -Math.cos(state.coilAngle) * endRadius;
      const ay = -Math.sin(state.coilAngle) * endRadius;
      const bx = Math.cos(state.coilAngle) * endRadius;
      const by = Math.sin(state.coilAngle) * endRadius;

      const leftCoilEnd = ax < bx ? { x: ax, y: ay, pole: endAPole } : { x: bx, y: by, pole: -endAPole };
      const rightCoilEnd = ax < bx ? { x: bx, y: by, pole: -endAPole } : { x: ax, y: ay, pole: endAPole };

      const leftMagAnchor = { x: -242, y: leftCoilEnd.y * 0.35 };
      const rightMagAnchor = { x: 242, y: rightCoilEnd.y * 0.35 };

      const leftIsRepel = (leftCoilEnd.pole * state.statorPolarity) > 0;
      const rightIsRepel = (rightCoilEnd.pole * (-state.statorPolarity)) > 0;

      // 힘이 작을 때는 기본 짧은 길이(36px), 전류 세기에 따라 최대 94px까지 길어짐
      const forceRatio = Math.min(1, Math.max(0.05, Math.abs(state.instantCurrent) / 28));
      const arrowLen = 36 + forceRatio * 58;

      drawForcePairBetween(leftMagAnchor, leftCoilEnd, leftIsRepel, arrowLen);
      drawForcePairBetween(rightMagAnchor, rightCoilEnd, rightIsRepel, arrowLen);
    }

    function drawForcePairBetween(magPt, coilPt, isRepel, arrowLen) {
      const dx = coilPt.x - magPt.x;
      const dy = coilPt.y - magPt.y;
      const angleMagToCoil = Math.atan2(dy, dx);
      const angleCoilToMag = angleMagToCoil + Math.PI;
      const midX = (magPt.x + coilPt.x) * 0.5;
      const midY = (magPt.y + coilPt.y) * 0.5;
      const halfLen = arrowLen * 0.5;

      if (isRepel) {
        const offsetAlong = 8 + halfLen * 0.52;
        const p1x = midX - Math.cos(angleMagToCoil) * offsetAlong;
        const p1y = midY - Math.sin(angleMagToCoil) * offsetAlong + 15;
        const p2x = midX + Math.cos(angleMagToCoil) * offsetAlong;
        const p2y = midY + Math.sin(angleMagToCoil) * offsetAlong - 15;
        drawSingleGlossyGreenArrow(p1x, p1y, angleCoilToMag, arrowLen);
        drawSingleGlossyGreenArrow(p2x, p2y, angleMagToCoil, arrowLen);
      } else {
        const p1x = magPt.x + Math.cos(angleMagToCoil) * (4 + halfLen * 0.55);
        const p1y = magPt.y + Math.sin(angleMagToCoil) * (4 + halfLen * 0.55) + 13;
        const p2x = coilPt.x - Math.cos(angleMagToCoil) * (4 + halfLen * 0.55);
        const p2y = coilPt.y - Math.sin(angleMagToCoil) * (4 + halfLen * 0.55) - 13;
        drawSingleGlossyGreenArrow(p1x, p1y, angleMagToCoil, arrowLen);
        drawSingleGlossyGreenArrow(p2x, p2y, angleCoilToMag, arrowLen);
      }
    }

    function drawSingleGlossyGreenArrow(x, y, angleRad, arrowLen) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      const headLen = 19;
      const headHalfW = 16.5;
      const shaftHalfW = 8.2;
      const halfTotal = arrowLen * 0.5;
      const tipX = halfTotal;
      const neckX = tipX - headLen;
      const tailX = -halfTotal;

      ctx.beginPath();
      ctx.moveTo(tipX, 0);
      ctx.lineTo(neckX, -headHalfW);
      ctx.lineTo(neckX, -shaftHalfW);
      ctx.lineTo(tailX, -shaftHalfW);
      ctx.lineTo(tailX, shaftHalfW);
      ctx.lineTo(neckX, shaftHalfW);
      ctx.lineTo(neckX, headHalfW);
      ctx.closePath();
      ctx.fillStyle = '#8CE026';
      ctx.fill();
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = '#4E8F10';
      ctx.lineJoin = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(tipX - 6, -2);
      ctx.lineTo(neckX + 3, -headHalfW + 6);
      ctx.lineWidth = 2.3;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    function drawTextbookRightHandOverlay(phys) {
      const { endAPole } = phys;
      if (endAPole === 0) return;
      const cosA = Math.cos(state.coilAngle);
      const sinA = Math.sin(state.coilAngle);
      const uprightAngle = cosA >= 0 ? Math.atan2(sinA, cosA) : Math.atan2(-sinA, -cosA);
      const nPoleOnLeft = (endAPole * (cosA >= 0 ? 1 : -1)) > 0;

      ctx.save();
      ctx.rotate(uprightAngle);
      const skinFill = 'rgba(245, 203, 156, 0.88)';
      const nailFill = 'rgba(253, 232, 209, 0.95)';

        ctx.beginPath();
        ctx.moveTo(10, 205); ctx.lineTo(10, 152); ctx.lineTo(-22, 108); ctx.lineTo(-65, 68);
        ctx.lineTo(-116, 40); ctx.lineTo(-152, 32); ctx.lineTo(-155, 16);
        ctx.quadraticCurveTo(-132, 2, -104, 10); ctx.lineTo(-34, 34);
        ctx.lineTo(-42, -55); ctx.lineTo(-45, -88); ctx.lineTo(-16, -102); ctx.lineTo(14, -92);
        ctx.lineTo(24, -108); ctx.lineTo(48, -116); ctx.lineTo(74, -106); ctx.lineTo(84, -92);
        ctx.lineTo(108, -90); ctx.lineTo(124, -72); ctx.lineTo(138, -62); ctx.lineTo(152, -38);
        ctx.lineTo(158, 28); ctx.lineTo(146, 132); ctx.lineTo(148, 205);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-154, 21); ctx.lineTo(-128, 24); ctx.lineTo(-130, 32); ctx.lineTo(-152, 32);
        ctx.closePath();
        ctx.fillStyle = nailFill; ctx.fill(); ctx.lineWidth = 2.0; ctx.stroke();
        ctx.restore();
      } else {
        ctx.save();
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-108, 84); ctx.quadraticCurveTo(-104, 132, -88, 165);
        ctx.lineTo(-88, 205); ctx.lineTo(42, 205); ctx.lineTo(50, 145);
        ctx.quadraticCurveTo(92, 96, 142, 62); ctx.lineTo(174, 58); ctx.lineTo(192, 60);
        ctx.lineTo(196, 48); ctx.quadraticCurveTo(188, 24, 152, 16);
        ctx.quadraticCurveTo(118, 14, 72, 34); ctx.lineTo(48, 34); ctx.lineTo(40, 84);
        ctx.closePath();
        ctx.fillStyle = skinFill; ctx.fill(); ctx.lineWidth = 3.0; ctx.strokeStyle = outlineColor; ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(168, 58); ctx.lineTo(175, 48); ctx.lineTo(195, 50); ctx.lineTo(192, 60);
        ctx.closePath();
        ctx.fillStyle = nailFill; ctx.fill(); ctx.lineWidth = 2.0; ctx.stroke();

        const curledFingers = [
          { xL: -104, xR: -66, yTop: -116, yBot: -78, nail: [[-94, -95], [-82, -100], [-72, -92], [-96, -88]] },
          { xL: -66, xR: -22, yTop: -126, yBot: -76, nail: [[-56, -98], [-44, -108], [-30, -96], [-58, -92]] },
          { xL: -22, xR: 26, yTop: -134, yBot: -76, nail: [[-12, -102], [2, -114], [16, -98], [-14, -94]] },
          { xL: 26, xR: 76, yTop: -130, yBot: -78, nail: [[36, -104], [52, -112], [66, -98], [36, -92]] }
        ];

        curledFingers.forEach((fg) => {
          const midX = (fg.xL + fg.xR) * 0.5;
          ctx.beginPath();
          ctx.moveTo(fg.xL, -84); ctx.lineTo(fg.xL + 3, fg.yTop + 14);
          ctx.quadraticCurveTo(midX, fg.yTop, fg.xR - 4, fg.yTop + 12);
          ctx.lineTo(fg.xR, -84); ctx.quadraticCurveTo(midX, fg.yBot + 8, fg.xL, -84);
          ctx.closePath();
          ctx.fillStyle = 'rgba(245, 203, 156, 0.96)'; ctx.fill(); ctx.lineWidth = 2.6; ctx.strokeStyle = outlineColor; ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(fg.nail[0][0], fg.nail[0][1]); ctx.lineTo(fg.nail[1][0], fg.nail[1][1]);
          ctx.lineTo(fg.nail[2][0], fg.nail[2][1]); ctx.lineTo(fg.nail[3][0], fg.nail[3][1]);
          ctx.closePath();
          ctx.fillStyle = nailFill; ctx.fill(); ctx.lineWidth = 1.8; ctx.stroke();
        });
        ctx.restore();
      }
      ctx.restore();
    }

    function drawTextbookPinkCenterArrow(x, y, angleRad) {
      ctx.save();

    function drawYellowStar(cx, cy, outerR, innerR) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = '#FEF08A'; ctx.fill();

    function drawTextbookCallouts() {
      ctx.save();
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.8; ctx.fillStyle = '#0f172a';
      ctx.font = '700 26px "Pretendard", sans-serif'; ctx.textBaseline = 'middle';

      ctx.beginPath(); ctx.moveTo(-375, -75); ctx.lineTo(-300, -75); ctx.stroke();

      const labelX = starWorldX < 0 ? starWorldX - 55 : starWorldX + 55;

      ctx.beginPath(); ctx.moveTo(starWorldX, starWorldY); ctx.lineTo(labelX, labelY); ctx.stroke();

    function togglePlayPause(forcePlay) {
      state.isPlaying = typeof forcePlay === 'boolean' ? forcePlay : !state.isPlaying;
      if (state.isPlaying) {
        if (!state.switchOn) togglePowerSwitch(true);
        if (state.currentLevel === 0) setCurrentLevel(1);
      }

      const btmBtn = document.getElementById('btmPlayPauseBtn');
      const btmIcon = document.getElementById('btmPlayPauseIcon');
      const btmText = document.getElementById('btmPlayPauseText');
      if (btmBtn) {
        if (state.isPlaying) {
          btmIcon.textContent = '⏸️'; btmText.textContent = '일시정지';
          btmBtn.className = 'px-4 py-1 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 border-2 border-slate-900 font-black text-xs shadow-sm flex items-center gap-1.5';
        } else {
          btmIcon.textContent = '▶️'; btmText.textContent = '실행';
          btmBtn.className = 'px-4 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-slate-900 font-black text-xs shadow-sm flex items-center gap-1.5 play-resume-pulse';
        }
      }

      const panelBtn = document.getElementById('panelPlayPauseBtn');
      const panelIcon = document.getElementById('panelPlayPauseIcon');
      const panelText = document.getElementById('panelPlayPauseText');
      if (panelBtn) {
        if (state.isPlaying) {
          panelIcon.textContent = '⏸️'; panelText.textContent = '일시정지';
          panelBtn.className = 'w-full py-1.5 px-3 rounded-xl font-black text-xs border-2 border-slate-900 bg-amber-400 hover:bg-amber-300 text-slate-950 shadow-sm flex items-center justify-center gap-1.5';
        } else {
          panelIcon.textContent = '▶️'; panelText.textContent = '실행';
          panelBtn.className = 'w-full py-1.5 px-3 rounded-xl font-black text-xs border-2 border-slate-900 bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm flex items-center justify-center gap-1.5 play-resume-pulse';
        }
      }
    }

    function setCoilAngleFromSlider(degVal) {
      togglePlayPause(false);
      const deg = parseFloat(degVal) || 0;
      state.coilAngle = (deg * Math.PI) / 180;
      state.angularVel = 0;
    }

    function rotateCoilByStep(deltaDeg) {
      togglePlayPause(false);
      state.coilAngle += (deltaDeg * Math.PI) / 180;
      state.angularVel = 0;
    }

    function toggleSettingsPanel(forceOpen) {
      state.settingsOpen = typeof forceOpen === 'boolean' ? forceOpen : !state.settingsOpen;
      const panel = document.getElementById('settingsPanel');
      const headerBtnText = document.getElementById('headerSettingsBtnText');
      const headerBtn = document.getElementById('headerSettingsBtn');

      if (state.settingsOpen) {
        panel.classList.remove('hidden');
        headerBtnText.textContent = '설정창 닫기 ✕';
        headerBtn.className = 'px-2.5 py-1 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-black text-xs shadow-sm flex items-center gap-1';
      } else {
        panel.classList.add('hidden');
        headerBtnText.textContent = '설정창 열기 ◂';
        headerBtn.className = 'px-2.5 py-1 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow-sm flex items-center gap-1';
      }
      setTimeout(resizeCanvas, 50);
    }

    function toggleRightHandOverlay(forceVal) {
      state.showRightHand = typeof forceVal === 'boolean' ? forceVal : !state.showRightHand;
      const chk = document.getElementById('chkRightHand');
      if (chk) chk.checked = state.showRightHand;
    }

    function togglePowerSwitch(forceOn) {
      state.switchOn = typeof forceOn === 'boolean' ? forceOn : !state.switchOn;
      const blade = document.getElementById('svgSwitchBlade');
      const lbl = document.getElementById('svgSwitchLabel');
      if (state.switchOn) {
        blade.setAttribute('y2', '68'); blade.setAttribute('stroke', '#15803d');
        lbl.textContent = '스위치 닫힘 (전류 ON)'; lbl.setAttribute('fill', '#15803d');
        if (state.currentLevel === 0) setCurrentLevel(1);
      } else {
        blade.setAttribute('y2', '53'); blade.setAttribute('stroke', '#dc2626');
        lbl.textContent = '스위치 열림 (전류 OFF)'; lbl.setAttribute('fill', '#dc2626');
        if (state.isPlaying) togglePlayPause(false);
      }
    }

    function flipCurrentDirection() {
      state.batteryPolarity = -state.batteryPolarity;
      updateCircuitDiagramBattery(state.batteryPolarity);
    }

    function updateCircuitDiagramBattery(pol) {
      const nub = document.getElementById('svgBatNub');
      const leftSign = document.getElementById('svgBatLeftSign');
      const rightSign = document.getElementById('svgBatRightSign');
      if (pol >= 0) {
        nub.setAttribute('x', '170'); leftSign.textContent = '+'; rightSign.textContent = '-';
      } else {
        nub.setAttribute('x', '223'); leftSign.textContent = '-'; rightSign.textContent = '+';
      }
    }

    function flipMagnetPoles() {
      state.statorPolarity = -state.statorPolarity;
      document.getElementById('miniLeftMag').textContent = state.statorPolarity > 0 ? 'N' : 'S';
      document.getElementById('miniRightMag').textContent = state.statorPolarity > 0 ? 'S' : 'N';
    }

    function setCurrentLevel(val) {
      let lvl = Math.max(0, Math.min(5, parseFloat(val) || 0));
      if (lvl < 0.04) lvl = 0;
      state.currentLevel = lvl;

      const lowIdx = Math.floor(lvl);
      const highIdx = Math.min(5, Math.ceil(lvl));
      const frac = lvl - lowIdx;
      state.currentAmp = LEVEL_TO_AMP[lowIdx] + (LEVEL_TO_AMP[highIdx] - LEVEL_TO_AMP[lowIdx]) * frac;

      const slider = document.getElementById('ampSlider');
      if (slider && parseFloat(slider.value) !== lvl) slider.value = lvl;

      const nearestStage = lvl === 0 ? 0 : Math.max(1, Math.round(lvl));
      const badge = document.getElementById('ampReadoutBadge');
      if (badge) {
        badge.textContent = LEVEL_LABELS[nearestStage];
        badge.className = lvl === 0
          ? 'px-2 py-0.5 rounded-full bg-slate-200 border border-slate-900 text-slate-900 font-black text-[10px] shrink-0'
          : 'px-2 py-0.5 rounded-full bg-yellow-300 border border-slate-900 text-slate-950 font-black text-[10px] shrink-0';
      }

      if (lvl > 0) {
        if (!state.switchOn) togglePowerSwitch(true);
        if (!state.isPlaying) togglePlayPause(true);
      } else {
        if (state.switchOn) togglePowerSwitch(false);
      }
    }

    function setCommutatorMode(isOn) {
      state.commutatorAutoFlip = Boolean(isOn);
      const toggleBtn = document.getElementById('btnCommutatorToggle');
      const onPill = document.getElementById('commOnPill');
      const offPill = document.getElementById('commOffPill');

      if (state.commutatorAutoFlip) {
        if (toggleBtn) toggleBtn.className = 'w-full py-1.5 px-2.5 rounded-xl font-black text-xs border-2 border-slate-900 bg-yellow-300 hover:bg-yellow-400 text-slate-950 shadow-sm flex items-center justify-between gap-1';
        if (onPill) onPill.className = 'px-1.5 py-0.5 rounded bg-slate-900 text-yellow-300 font-black';
        if (offPill) offPill.className = 'px-1.5 py-0.5 rounded text-slate-400 font-bold';
      } else {
        if (toggleBtn) toggleBtn.className = 'w-full py-1.5 px-2.5 rounded-xl font-bold text-xs border-2 border-slate-400 bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-between gap-1';
        if (onPill) onPill.className = 'px-1.5 py-0.5 rounded text-slate-400 font-bold';
        if (offPill) offPill.className = 'px-1.5 py-0.5 rounded bg-slate-800 text-white font-black';
      }
    }

    let prevTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - prevTime) / 1000);
      prevTime = now;
      const phys = updatePhysics(dt);
      renderTextbookMotor(phys);
    }

    window.onload = function () {
      resizeCanvas();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
