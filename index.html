  <style>

<body class="relative flex flex-col h-screen w-screen overflow-hidden bg-white">

  <!-- ================= 1. 상단 헤더 바 (제목 옆 설정창 닫기 버튼 배치) ================= -->
  <header class="w-full bg-slate-50 border-b border-slate-200 px-3 py-1.5 flex items-center justify-between gap-2 z-30 shrink-0">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 rounded-lg bg-yellow-300 border-2 border-slate-900 text-slate-950 font-black text-xs shadow-sm">
        중2 과학 7-3-2
      </span>
      <h1 class="text-base font-black tracking-tight text-slate-900" style="margin:0;">전동기의 원리</h1>
    </div>
    <button id="headerSettingsBtn" onclick="toggleSettingsPanel()" class="px-2.5 py-1 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-black text-xs shadow-sm flex items-center gap-1">
      <span>⚙️</span>
      <span id="headerSettingsBtnText">설정창 닫기 ✕</span>
    </button>
  </header>

  <!-- ================= 2. 메인 영역 ================= -->
  <div class="relative flex-1 flex overflow-hidden w-full bg-white">
    <main id="canvasWrapper" class="relative flex-1 h-full flex flex-col items-center justify-start overflow-hidden bg-white">
      <!-- 전동기 캔버스 스테이지 (하단 컨트롤 바와 간격 밀착) -->
      <div id="stageBox" class="relative w-full flex items-center justify-center overflow-hidden" style="height: min(calc(100vh - 86px), 52vw); min-height: 290px; max-height: 460px;">
        <canvas id="motorCanvas" class="block w-full h-full"></canvas>
      </div>

      <!-- 하단 컨트롤 바 (전동기 그림 바로 아래 밀착 배치) -->
      <div class="w-full max-w-5xl px-3 pb-1 z-10 shrink-0" style="margin-top: -8px;">
        <div class="bg-slate-50 border-2 border-slate-300 rounded-2xl px-3 py-1.5 shadow-md">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <button id="btmPlayPauseBtn" onclick="togglePlayPause()" class="px-4 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-slate-900 font-black text-xs shadow-sm flex items-center gap-1.5 play-resume-pulse">
                <span id="btmPlayPauseIcon">▶️</span> <span id="btmPlayPauseText">실행</span>
              </button>
              <span class="hide-mobile text-[11px] font-bold text-slate-500">(단축키: Space)</span>
            </div>

            <div class="flex flex-1 min-w-slider max-w-xl items-center gap-2 bg-white border border-slate-300 rounded-xl px-2.5 py-1 shadow-inner">
              <button onclick="rotateCoilByStep(-15)" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-indigo-100 text-slate-900 font-black text-xs border border-slate-300 shrink-0">⏪ 회전</button>
              <div class="flex-1 flex items-center gap-2 px-1">
                <span class="text-[10px] font-black text-slate-600 shrink-0">코일 각도 조절</span>
                <input type="range" id="angleSlider" min="0" max="360" step="1" value="35" oninput="setCoilAngleFromSlider(this.value)" class="angle-slider" />
              </div>
              <button onclick="rotateCoilByStep(15)" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-indigo-100 text-slate-900 font-black text-xs border border-slate-300 shrink-0">회전 ⏩</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= 3. 우측 설정창 (크롬북 한 화면 최적화 및 하단 빈 여백 제거) ================= -->
    <aside id="settingsPanel" class="settings-drawer bg-slate-50 shadow-xl flex flex-col z-20 shrink-0 overflow-hidden">
      <div class="px-3 py-1.5 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-1">
          <span>⚙️</span>
          <h2 class="text-xs font-black text-slate-900" style="margin:0;">전동기 실험 설정</h2>
        </div>
        <button onclick="toggleSettingsPanel(false)" class="px-2 py-0.5 rounded-lg bg-slate-100 hover:bg-rose-100 hover:text-rose-700 text-slate-700 font-black text-[11px] border border-slate-300 flex items-center gap-1">
          <span>✕</span> <span>닫기</span>
        </button>
      </div>

      <div class="p-3.5 space-y-2 overflow-y-auto custom-scroll flex flex-col justify-start">
        <!-- 실행 / 일시정지 단일 토글 버튼 -->
        <button id="panelPlayPauseBtn" onclick="togglePlayPause()" class="w-full py-1.5 px-3 rounded-xl font-black text-xs border-2 border-slate-900 bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm flex items-center justify-center gap-1.5 play-resume-pulse">
          <span id="panelPlayPauseIcon">▶️</span> <span id="panelPlayPauseText">실행</span>

        <!-- 자석 방향 바꾸기 / 전류 방향 바꾸기 버튼 2개 -->
        <div class="bg-white border border-slate-200 rounded-2xl p-2 shadow-sm">

              <span>전류 방향</span>
              <span>바꾸기</span>

        <!-- 전류의 세기 조절 (끊김 없는 연속형 슬라이더, 초기값 0 OFF) -->
        <div class="bg-white border border-slate-200 rounded-2xl p-2 shadow-sm">
          <div class="flex items-center justify-between gap-1 mb-1">
            <span class="text-xs font-black text-slate-800">🎚️ 전류의 세기 조절</span>
            <span id="ampReadoutBadge" class="px-2 py-0.5 rounded-full bg-slate-200 border border-slate-900 text-slate-900 font-black text-[10px] shrink-0">0 OFF</span>
          </div>
          <div class="px-1 pt-0.5 pb-0.5">
            <input type="range" id="ampSlider" min="0" max="5" step="0.01" value="0" oninput="setCurrentLevel(this.value)" class="amp-slider" />
            <div class="flex justify-between text-[10px] font-bold text-slate-500 mt-1 px-0.5">
              <span onclick="setCurrentLevel(0)" class="cursor-pointer hover:text-slate-900">OFF</span>
              <span onclick="setCurrentLevel(1)" class="cursor-pointer hover:text-slate-900">미약</span>
              <span onclick="setCurrentLevel(2)" class="cursor-pointer hover:text-slate-900">약</span>
              <span onclick="setCurrentLevel(3)" class="cursor-pointer hover:text-slate-900">중</span>
              <span onclick="setCurrentLevel(4)" class="cursor-pointer hover:text-slate-900">강</span>
              <span onclick="setCurrentLevel(5)" class="cursor-pointer hover:text-slate-900">초강</span>
            </div>
          </div>
        </div>

        <!-- 반바퀴마다 전류 전환 ON / OFF 동시 표시 토글 버튼 -->
        <button id="btnCommutatorToggle" onclick="setCommutatorMode(!state.commutatorAutoFlip)" class="w-full py-1.5 px-2.5 rounded-xl font-black text-xs border-2 border-slate-900 bg-yellow-300 hover:bg-yellow-400 text-slate-950 shadow-sm flex items-center justify-between gap-1">
          <span class="flex items-center gap-1 whitespace-nowrap"><span>🔄</span> 반바퀴마다 전류 전환</span>
          <span class="inline-flex items-center bg-white border border-slate-900 rounded-lg p-0.5 text-[10px] font-black shrink-0">
            <span id="commOnPill" class="px-1.5 py-0.5 rounded bg-slate-900 text-yellow-300">ON</span>
            <span id="commOffPill" class="px-1.5 py-0.5 rounded text-slate-400">OFF</span>
          </span>
        </button>

        <!-- 👁️ 표시 옵션 (모두 초기 OFF, 명칭 없애기 최상단) -->
        <div class="bg-white border border-slate-200 rounded-2xl p-2 space-y-1 shadow-sm">
          <div class="text-xs font-black text-slate-800 mb-0.5">👁️ 표시 옵션</div>

          <label class="opt-item-compact flex items-center gap-1.5 bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chkHideCalloutLabels" onchange="state.showCallouts = !this.checked" class="accent-slate rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">🏷️ 명칭 없애기</span>
          </label>

          <label class="opt-item-compact flex items-center gap-1.5 bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chkPinkCenterArrow" onchange="state.showPinkCenterArrow = this.checked" class="accent-rose rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">🩷 중앙 큰 전류 화살표 표시</span>
          </label>

          <label class="opt-item-compact flex items-center gap-1.5 bg-amber-50 border border-amber-200 cursor-pointer hover:bg-amber-100">
            <input type="checkbox" id="chkRightHand" onchange="toggleRightHandOverlay(this.checked)" class="accent-amber rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-amber-950" style="white-space: nowrap;">✋ 오른손(극 찾기) 보기</span>
          </label>

          <label class="opt-item-compact flex items-center gap-1.5 bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chkPoleColors" onchange="state.showPoleColors = this.checked" class="accent-rose rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">🎨 코일의 극성 표시 (빨강/파랑 N·S)</span>
          </label>

          <label class="opt-item-compact flex items-center gap-1.5 bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chkGreenForceArrows" onchange="state.showGreenForceArrows = this.checked" class="accent-lime rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">💚 힘 화살표(연두색) 표시</span>
          </label>

          <label class="opt-item-compact flex items-center gap-1.5 bg-slate-50 border border-slate-200 cursor-pointer hover:bg-slate-100">
            <input type="checkbox" id="chkMagneticField" onchange="state.showMagneticField = this.checked" class="accent-sky rounded shrink-0" />
            <span class="text-[10.5px] font-bold text-slate-800" style="white-space: nowrap;">🧲 자석·코일 자기력선 상호작용 표시</span>
          </label>
        </div>

      </div>
    </aside>
  </div>

  <!-- ================= 4. 시뮬레이터 엔진 스크립트 ================= -->
  <script>
    const LEVEL_TO_AMP = { 0: 0, 1: 1.5, 2: 5.0, 3: 11.0, 4: 18.0, 5: 28.0 };
    const LEVEL_LABELS = { 0: '0 OFF', 1: '1 미약', 2: '2 약', 3: '3 중', 4: '4 강', 5: '5 초강' };

    const state = {
      isPlaying: false,
      switchOn: false,
      currentLevel: 0,
      currentAmp: 0,
      batteryPolarity: 1,
      statorPolarity: 1,
      commutatorAutoFlip: true,
      instantCurrent: 0,
      coilAngle: (35 * Math.PI) / 180,
      angularVel: 0,
      wireArrowPhase: 0,
      flipFlashTimer: 0,
      showRightHand: false,
      showMagneticField: false,
      showPoleColors: false,
      showGreenForceArrows: false,
      showPinkCenterArrow: false,
      showCallouts: true,
      settingsOpen: true
    };

    const canvas = document.getElementById('motorCanvas');
    const ctx = canvas.getContext('2d');

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const radius = typeof r === 'number' ? r : 8;
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        this.closePath();
        return this;
      };
    }

    function resizeCanvas() {
      const stageBox = document.getElementById('stageBox');
      if (!stageBox || !canvas) return;
      const rect = stageBox.getBoundingClientRect();
      canvas.width = Math.max(320, Math.floor(rect.width));
      canvas.height = Math.max(240, Math.floor(rect.height));
    }

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        rotateCoilByStep(-15);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        rotateCoilByStep(15);
      }
    });

    function updatePhysics(dt) {
      let iExt = 0;
      if (!state.switchOn || state.currentLevel <= 0.01 || state.currentAmp <= 0.01) {
        iExt = 0;
      } else {
        iExt = state.currentAmp * state.batteryPolarity;
      }
      state.instantCurrent = iExt;

      const normAngle = ((state.coilAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const inSecondHalf = normAngle >= Math.PI;
      const commFactor = state.commutatorAutoFlip ? (inSecondHalf ? -1 : 1) : 1;
      const iCoilLocal = iExt * commFactor;

      let endAPole = 0;
      if (Math.abs(iCoilLocal) > 0.05) {
        endAPole = iCoilLocal >= 0 ? 1 : -1;
      }

      if (Math.abs(iCoilLocal) > 0.05) {
        const arrowSpeed = (iCoilLocal / 5.0) * 1.45 * (state.isPlaying ? 1.0 : 0.45);
        state.wireArrowPhase = ((state.wireArrowPhase + arrowSpeed * dt) % 1 + 1) % 1;
      }

      if (state.isPlaying) {
        if (Math.abs(iExt) < 0.05) {
          state.angularVel *= Math.pow(0.05, dt);
        } else if (state.commutatorAutoFlip) {
          const prevHalf = Math.floor(normAngle / Math.PI);
          const rotDir = state.batteryPolarity * state.statorPolarity;
          const baseOmega = 0.22 + (state.currentAmp / 10.0) * 1.6;
          const targetVel = rotDir * baseOmega;
          state.angularVel += (targetVel - state.angularVel) * Math.min(1, dt * 10.0);
          state.coilAngle += state.angularVel * dt;

          const newNorm = ((state.coilAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          if (Math.floor(newNorm / Math.PI) !== prevHalf) {
            state.flipFlashTimer = 0.7;
          }
        } else {
          const attractAngle = (endAPole * state.statorPolarity > 0) ? Math.PI : 0;
          let diff = attractAngle - normAngle;
          if (diff > Math.PI) diff -= Math.PI * 2;
          if (diff < -Math.PI) diff += Math.PI * 2;
          const pullTorque = diff * (2.8 + state.currentAmp * 1.1);
          state.angularVel += pullTorque * dt;
          state.angularVel *= Math.pow(0.1, dt);
          state.coilAngle += state.angularVel * dt;
        }
      } else {
        state.angularVel = 0;
      }

      if (state.flipFlashTimer > 0) {
        state.flipFlashTimer = Math.max(0, state.flipFlashTimer - dt);
      }

      syncAngleUI(normAngle);

      return { endAPole, iCoilLocal, normAngle };
    }

    function syncAngleUI(normAngle) {
      const deg = Math.round((normAngle * 180) / Math.PI) % 360;
      const slider = document.getElementById('angleSlider');
      if (slider && document.activeElement !== slider) slider.value = deg;
    }

    function renderTextbookMotor(phys) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const baseW = state.showCallouts ? 780 : 690;
      const baseH = 340;
      const scale = Math.min(w / baseW, h / baseH) * 0.98;

      ctx.save();
      ctx.translate(w / 2, h / 2 + 8);
      ctx.scale(scale, scale);

      drawTextbookStatorMagnets();

      if (state.showMagneticField) {
        drawStatorMagneticField(false, phys);
      }

      drawTextbookCoilAndCurrentArrows(phys);

      if (state.showMagneticField) {
        drawStatorMagneticField(true, phys);
      }

      if (state.showGreenForceArrows && phys.endAPole !== 0) {
        drawGreenForceArrows(phys);
      }

      if (state.showRightHand) {
        drawTextbookRightHandOverlay(phys);
      }

      if (state.showCallouts) {
        drawTextbookCallouts();
      }

      ctx.restore();
    }

    function drawTextbookStatorMagnets() {
      const leftIsN = state.statorPolarity > 0;
      const leftFill = leftIsN ? '#E65132' : '#5496D4';
      const leftStroke = leftIsN ? '#9E2412' : '#274F7D';
      const leftLabel = leftIsN ? 'N' : 'S';
      const rightFill = leftIsN ? '#5496D4' : '#E65132';
      const rightStroke = leftIsN ? '#274F7D' : '#9E2412';
      const rightLabel = leftIsN ? 'S' : 'N';

      const outerX = 335;
      const innerTipX = 228;
      const topY = -140;
      const botY = 140;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-outerX, topY);
      ctx.lineTo(-innerTipX, topY);
      ctx.quadraticCurveTo(-innerTipX - 42, 0, -innerTipX, botY);
      ctx.lineTo(-outerX, botY);
      ctx.closePath();
      ctx.fillStyle = leftFill;
      ctx.fill();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = leftStroke;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 44px "Pretendard", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(leftLabel, -292, 4);
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(outerX, topY);
      ctx.lineTo(innerTipX, topY);
      ctx.quadraticCurveTo(innerTipX + 42, 0, innerTipX, botY);
      ctx.lineTo(outerX, botY);
      ctx.closePath();
      ctx.fillStyle = rightFill;
      ctx.fill();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = rightStroke;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 44px "Pretendard", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(rightLabel, 292, 4);
      ctx.restore();
    }

    function drawStatorMagneticField(isForeground, phys) {
      const endAPole = phys ? phys.endAPole : 0;
      const normAngle = phys ? phys.normAngle : 0;
      const statorPol = state.statorPolarity >= 0 ? 1 : -1;
      const cosA = Math.cos(state.coilAngle);
      const sinA = Math.sin(state.coilAngle);

      if (endAPole === 0) {
        const yLines = [-104, -52, 0, 52, 104];
        ctx.save();
        if (!isForeground) {
          ctx.strokeStyle = 'rgba(2, 132, 199, 0.58)';
          ctx.lineWidth = 2.6;
          yLines.forEach(y => {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            ctx.beginPath();
            ctx.moveTo(-xEdge, y);
            ctx.lineTo(xEdge, y);
            ctx.stroke();
          });
        } else {
          yLines.forEach(y => {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            ctx.save();
            ctx.strokeStyle = 'rgba(2, 132, 199, 0.25)';
            ctx.lineWidth = 2.0;
            ctx.setLineDash([7, 7]);
            ctx.beginPath();
            ctx.moveTo(-xEdge, y);
            ctx.lineTo(xEdge, y);
            ctx.stroke();
            ctx.restore();
            [-195, 0, 195].forEach((ax, idx) => {
              drawFieldArrowhead(ax, y, statorPol > 0 ? 0 : Math.PI, idx === 1 ? 'rgba(2, 132, 199, 0.45)' : '#0284c7', idx !== 1);
            });
          });
          drawMagneticFieldBanner('🧲 양쪽 자석의 자기력선 (전류 OFF : N극 ➔ S극)', '#0284c7', '#f0f9ff', '#0369a1');
        }
        ctx.restore();
        return;
      }

      if (!isForeground) {
        const ampRatio = 0.6 + 0.45 * (Math.min(28, Math.abs(state.instantCurrent)) / 28);
        const poleSources = [];
        for (let m = 0; m < 9; m++) {
          const ym = -116 + 29 * m;
          const t = (ym + 140) / 280;
          const xInner = 228 + 84 * t * (1 - t);
          poleSources.push({ x: -xInner - 22, y: ym, q: statorPol * 1.45, r2: 750 });
          poleSources.push({ x: xInner + 22, y: ym, q: -statorPol * 1.45, r2: 750 });
        }

        for (let k = 0; k < 7; k++) {
          const vk = -66 + 22 * k;
          const uMax = 152 + 18 * (1 - (vk / 84) * (vk / 84));
          const uA = -uMax + 20;
          const uB = uMax - 20;
          const xA = uA * cosA - vk * sinA;
          const yA = uA * sinA + vk * cosA;
          const xB = uB * cosA - vk * sinA;
          const yB = uB * sinA + vk * cosA;
          poleSources.push({ x: xA, y: yA, q: endAPole * 1.65 * ampRatio, r2: 520 });
          poleSources.push({ x: xB, y: yB, q: -endAPole * 1.65 * ampRatio, r2: 520 });
        }

        function sampleCombinedField(x, y) {
          let bx = statorPol * 0.015;
          let by = 0;
          for (let i = 0; i < poleSources.length; i++) {
            const s = poleSources[i];
            const dx = x - s.x;
            const dy = y - s.y;
            const d2 = dx * dx + dy * dy + s.r2;
            const factor = s.q / (d2 * Math.sqrt(d2)) * 180;
            bx += dx * factor;
            by += dy * factor;
          }
          const u = x * cosA + y * sinA;
          const v = -x * sinA + y * cosA;
          if (Math.abs(u) < 138 && Math.abs(v) < 116) {
            const wu = Math.max(0, Math.min(1, (138 - Math.abs(u)) / 20));
            const wv = Math.max(0, Math.min(1, (116 - Math.abs(v)) / 30));
            const damp = wu * wv;
            let fu = bx * cosA + by * sinA;
            let fv = -bx * sinA + by * cosA;
            fv *= (1 - damp);
            if (Math.abs(fu) < 0.008) fu = (fu >= 0 ? 1 : -1) * 0.008;
            bx = fu * cosA - fv * sinA;
            by = fu * sinA + fv * cosA;
          }
          return { bx, by };
        }

        function hitMagnetOrCoilBoundary(x, y) {
          if (Math.abs(x) > 350 || Math.abs(y) > 205) return true;
          if (Math.abs(y) <= 140) {
            const t = (y + 140) / 280;
            const xEdge = 228 + 84 * t * (1 - t);
            if (x <= -xEdge + 1 || x >= xEdge - 1) return true;
          }
          const u = x * cosA + y * sinA;
          const v = -x * sinA + y * cosA;
          if (Math.abs(v) <= 84) {
            const uMax = 152 + 18 * (1 - (v / 84) * (v / 84));
            if (Math.abs(u) <= uMax - 1 && Math.abs(u) >= 126) return true;
          }
          return false;
        }

        function traceFieldLine(startX, startY, traceDir, sourceTag) {
          const pts = [{ x: startX, y: startY }];
          let cx = startX;
          let cy = startY;
          const stepSize = 5.0;
          let prevUx = 0, prevUy = 0;

          for (let step = 0; step < 165; step++) {
            const f1 = sampleCombinedField(cx, cy);
            const m1 = Math.hypot(f1.bx, f1.by);
            if (m1 < 0.0012) break;
            const ux1 = (f1.bx / m1) * traceDir;
            const uy1 = (f1.by / m1) * traceDir;
            if (step > 0 && (ux1 * prevUx + uy1 * prevUy) < -0.25) break;

            const mx = cx + ux1 * (stepSize * 0.5);
            const my = cy + uy1 * (stepSize * 0.5);
            const f2 = sampleCombinedField(mx, my);
            const m2 = Math.hypot(f2.bx, f2.by);
            if (m2 < 0.0012) break;

            const ux2 = (f2.bx / m2) * traceDir;
            const uy2 = (f2.by / m2) * traceDir;
            cx += ux2 * stepSize;
            cy += uy2 * stepSize;
            pts.push({ x: cx, y: cy });
            prevUx = ux2;
            prevUy = uy2;
            if (step >= 3 && hitMagnetOrCoilBoundary(cx, cy)) break;
          }
          if (traceDir < 0) pts.reverse();
          return { pts, sourceTag };
        }

        const tracedLines = [];
        const statorN_XSign = statorPol > 0 ? -1 : 1;
        [-112, -75, -37, 0, 37, 75, 112].forEach(sy => {
          const t = (sy + 140) / 280;
          const xEdge = 228 + 84 * t * (1 - t);
          tracedLines.push(traceFieldLine(statorN_XSign * (xEdge - 3), sy, 1, 'stator'));
        });

        const coilN_USign = endAPole > 0 ? -1 : 1;
        [-68, -45, -22, 0, 22, 45, 68].forEach(sv => {
          const uMax = 152 + 18 * (1 - (sv / 84) * (sv / 84));
          const su = coilN_USign * (uMax + 3);
          const sx = su * cosA - sv * sinA;
          const sy = su * sinA + sv * cosA;
          if (!hitMagnetOrCoilBoundary(sx, sy)) {
            tracedLines.push(traceFieldLine(sx, sy, 1, 'coil'));
          }
        });

        function isNearExistingLine(px, py, minDist) {
          const d2Max = minDist * minDist;
          for (let i = 0; i < tracedLines.length; i++) {
            const pts = tracedLines[i].pts;
            for (let j = 0; j < pts.length; j += 2) {
              const dx = pts[j].x - px;
              const dy = pts[j].y - py;
              if (dx * dx + dy * dy < d2Max) return true;
            }
          }
          return false;
        }

        const statorS_XSign = -statorN_XSign;
        [-112, -75, -37, 0, 37, 75, 112].forEach(sy => {
          const t = (sy + 140) / 280;
          const xEdge = 228 + 84 * t * (1 - t);
          const sx = statorS_XSign * (xEdge - 3);
          if (!isNearExistingLine(sx, sy, 22)) {
            tracedLines.push(traceFieldLine(sx, sy, -1, 'stator'));
          }
        });

        [-68, -45, -22, 0, 22, 45, 68].forEach(sv => {
          const uMax = 152 + 18 * (1 - (sv / 84) * (sv / 84));
          const su = -coilN_USign * (uMax + 3);
          const sx = su * cosA - sv * sinA;
          const sy = su * sinA + sv * cosA;
          if (!hitMagnetOrCoilBoundary(sx, sy) && !isNearExistingLine(sx, sy, 20)) {
            tracedLines.push(traceFieldLine(sx, sy, -1, 'coil'));
          }
        });

        ctx.save();
        tracedLines.forEach(line => {
          const pts = line.pts;
          if (pts.length < 4) return;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.strokeStyle = line.sourceTag === 'coil' ? 'rgba(37, 99, 235, 0.78)' : 'rgba(2, 132, 199, 0.72)';
          ctx.lineWidth = line.sourceTag === 'coil' ? 2.7 : 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();

          const arrowIndices = pts.length > 26 ? [Math.floor(pts.length * 0.35), Math.floor(pts.length * 0.72)] : [Math.floor(pts.length * 0.52)];
          arrowIndices.forEach(idx => {
            if (idx > 0 && idx < pts.length - 1) {
              const pPrev = pts[idx - 1];
              const pNext = pts[idx + 1];
              const ang = Math.atan2(pNext.y - pPrev.y, pNext.x - pPrev.x);
              drawFieldArrowhead(pts[idx].x, pts[idx].y, ang, line.sourceTag === 'coil' ? '#2563eb' : '#0284c7', true);
            }
          });
        });
        ctx.restore();
      } else {
        ctx.save();
        ctx.rotate(state.coilAngle);
        const internalDir = endAPole > 0 ? -1 : 1;
        [-44, 0, 44].forEach(vLine => {
          ctx.save();
          ctx.strokeStyle = 'rgba(37, 99, 235, 0.26)';
          ctx.lineWidth = 2.0;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(-132, vLine);
          ctx.lineTo(132, vLine);
          ctx.stroke();
          ctx.restore();
          drawFieldArrowhead(internalDir * 52, vLine, internalDir > 0 ? 0 : Math.PI, 'rgba(37, 99, 235, 0.42)', false);
        });
        ctx.restore();

        const deg = (normAngle * 180) / Math.PI;
        const nearHorizontal = deg < 12 || deg > 348 || Math.abs(deg - 180) < 12;
        const leftEndPole = Math.cos(normAngle) >= 0 ? endAPole : -endAPole;
        const isRepulsion = (leftEndPole * statorPol) > 0;

        if (nearHorizontal) {
          drawMagneticFieldBanner('⚡ 전류 방향 전환 순간 : 코일의 N·S극과 자기력선 반전!', '#d97706', 'rgba(254, 243, 199, 0.94)', '#92400e');
        } else if (isRepulsion) {
          drawMagneticFieldBanner('🧲 자기력선 상호작용 : 같은 극끼리 서로 밀어내어 휘어짐 (척력 ↔)', '#4d7c0f', 'rgba(247, 254, 231, 0.94)', '#3f6212');
        } else {
          drawMagneticFieldBanner('🧲 자기력선 상호작용 : 다른 극(N➔S)끼리 연결되어 당김 (인력 ➔⬅)', '#0284c7', 'rgba(240, 249, 255, 0.94)', '#0369a1');
        }
      }
    }

    function drawFieldArrowhead(x, y, angleRad, fillColor, withStroke) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      ctx.beginPath();
      ctx.moveTo(8.5, 0);
      ctx.lineTo(-6.5, -5.8);
      ctx.lineTo(-3.8, 0);
      ctx.lineTo(-6.5, 5.8);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();
      if (withStroke) {
        ctx.lineWidth = 1.1;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawMagneticFieldBanner(text, borderColor, bgColor, textColor) {
      ctx.save();
      ctx.translate(0, -172);
      ctx.font = '700 13px "Pretendard", sans-serif';
      const boxW = Math.max(260, ctx.measureText(text).width + 32);
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(-boxW / 2, -14, boxW, 28, 14);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 1);
      ctx.restore();
    }

    function drawTextbookCoilAndCurrentArrows(phys) {
      const { endAPole } = phys;
      ctx.save();
      ctx.rotate(state.coilAngle);

      const halfLen = 152;
      const halfThick = 84;
      const wireXList = [-95, -57, -19, 19, 57, 95];
      const wireTilt = 14;

      wireXList.forEach(wx => {
        const topX = wx - wireTilt;
        const botX = wx + wireTilt;
        ctx.beginPath();
        ctx.arc(topX + 7, -halfThick, 10, Math.PI, 0, false);
        ctx.lineWidth = 8.5; ctx.strokeStyle = '#B88714'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 6; ctx.strokeStyle = '#DEB12A'; ctx.stroke();

        ctx.beginPath();
        ctx.arc(botX - 7, halfThick, 10, 0, Math.PI, false);
        ctx.lineWidth = 8.5; ctx.strokeStyle = '#B88714'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.lineWidth = 6; ctx.strokeStyle = '#DEB12A'; ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(-halfLen, -halfThick);
      ctx.lineTo(halfLen, -halfThick);
      ctx.quadraticCurveTo(halfLen + 36, 0, halfLen, halfThick);
      ctx.lineTo(-halfLen, halfThick);
      ctx.quadraticCurveTo(-halfLen - 36, 0, -halfLen, -halfThick);
      ctx.closePath();

      if (endAPole === 0 || !state.showPoleColors) {
        ctx.fillStyle = '#CCCCCC';
      } else {
        const grad = ctx.createLinearGradient(-halfLen - 25, 0, halfLen + 25, 0);
        if (endAPole > 0) {
          grad.addColorStop(0.0, '#E65132'); grad.addColorStop(0.24, '#EB6E54');
          grad.addColorStop(0.42, '#CCCCCC'); grad.addColorStop(0.58, '#CCCCCC');
          grad.addColorStop(0.76, '#6BA5DC'); grad.addColorStop(1.0, '#4A8FD1');
        } else {
          grad.addColorStop(0.0, '#4A8FD1'); grad.addColorStop(0.24, '#6BA5DC');
          grad.addColorStop(0.42, '#CCCCCC'); grad.addColorStop(0.58, '#CCCCCC');
          grad.addColorStop(0.76, '#EB6E54'); grad.addColorStop(1.0, '#E65132');
        }
        ctx.fillStyle = grad;
      }
      ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = '#7F7F7F'; ctx.stroke();

      drawYellowStar(-halfLen + 22, -halfThick + 22, 11, 5);

      wireXList.forEach(wx => {
        const topX = wx - wireTilt;
        const botX = wx + wireTilt;
        ctx.beginPath();
        ctx.moveTo(topX, -halfThick - 2); ctx.lineTo(botX, halfThick + 2);
        ctx.lineWidth = 9.5; ctx.strokeStyle = '#B58410'; ctx.lineCap = 'round'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(topX, -halfThick - 2); ctx.lineTo(botX, halfThick + 2);
        ctx.lineWidth = 6.5; ctx.strokeStyle = '#E2B42B'; ctx.lineCap = 'round'; ctx.stroke();
      });

      if (endAPole !== 0) {
        const flowUpward = endAPole > 0;
        wireXList.forEach((wx, idx) => {
          const topX = wx - wireTilt;
          const botX = wx + wireTilt;
          const angle = flowUpward ? Math.atan2(-halfThick - halfThick, topX - botX) : Math.atan2(halfThick - (-halfThick), botX - topX);
          for (let k = 0; k < 2; k++) {
            let t = (state.wireArrowPhase + k / 2 + (idx % 2) * 0.15) % 1;
            if (!flowUpward) {
              const px = topX + (botX - topX) * t;
              const py = -halfThick + 22 + (halfThick * 2 - 44) * t;
              drawVividYellowCurrentArrow(px, py, angle);
            } else {
              const px = botX + (topX - botX) * t;
              const py = halfThick - 22 + (-halfThick * 2 + 44) * t;
              drawVividYellowCurrentArrow(px, py, angle);
            }
          }
        });

        if (state.showPoleColors) {
          ctx.save();
          ctx.translate(-halfLen + 18, 12); ctx.rotate(-state.coilAngle);
          ctx.fillStyle = '#FFFFFF'; ctx.font = '700 38px "Pretendard", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(endAPole > 0 ? 'N' : 'S', 0, 0);
          ctx.restore();

          ctx.save();
          ctx.translate(halfLen - 18, 12); ctx.rotate(-state.coilAngle);
          ctx.fillStyle = '#FFFFFF'; ctx.font = '700 38px "Pretendard", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(endAPole > 0 ? 'S' : 'N', 0, 0);
          ctx.restore();
        }

        if (state.showPinkCenterArrow) {
          const centerAngle = flowUpward ? Math.atan2(-halfThick - halfThick, -wireTilt * 2) : Math.atan2(halfThick - (-halfThick), wireTilt * 2);
          drawTextbookPinkCenterArrow(0, 0, centerAngle);
        }
      }
      ctx.restore();
    }

    function drawVividYellowCurrentArrow(x, y, angleRad) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      ctx.beginPath();
      ctx.moveTo(22, 0);
      ctx.lineTo(8, -12);
      ctx.lineTo(8, -5);
      ctx.lineTo(-22, -5);
      ctx.lineTo(-22, 5);
      ctx.lineTo(8, 5);
      ctx.lineTo(8, 12);
      ctx.closePath();
      ctx.fillStyle = '#FFEE00';
      ctx.fill();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#111111';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }

    function drawGreenForceArrows(phys) {
      const { endAPole, normAngle } = phys;
      const deg = (normAngle * 180) / Math.PI;
      if (deg < 8 || deg > 352 || Math.abs(deg - 180) < 8) return;

      const endRadius = 158;
      const ax = -Math.cos(state.coilAngle) * endRadius;
      const ay = -Math.sin(state.coilAngle) * endRadius;
      const bx = Math.cos(state.coilAngle) * endRadius;
      const by = Math.sin(state.coilAngle) * endRadius;

      const leftCoilEnd = ax < bx ? { x: ax, y: ay, pole: endAPole } : { x: bx, y: by, pole: -endAPole };
      const rightCoilEnd = ax < bx ? { x: bx, y: by, pole: -endAPole } : { x: ax, y: ay, pole: endAPole };

      const leftMagAnchor = { x: -242, y: leftCoilEnd.y * 0.35 };
      const rightMagAnchor = { x: 242, y: rightCoilEnd.y * 0.35 };

      const leftIsRepel = (leftCoilEnd.pole * state.statorPolarity) > 0;
      const rightIsRepel = (rightCoilEnd.pole * (-state.statorPolarity)) > 0;

      const forceRatio = Math.min(1, Math.max(0.05, Math.abs(state.instantCurrent) / 28));
      const arrowLen = 36 + forceRatio * 58;

      drawForcePairBetween(leftMagAnchor, leftCoilEnd, leftIsRepel, arrowLen);
      drawForcePairBetween(rightMagAnchor, rightCoilEnd, rightIsRepel, arrowLen);
    }

    function drawForcePairBetween(magPt, coilPt, isRepel, arrowLen) {
      const dx = coilPt.x - magPt.x;
      const dy = coilPt.y - magPt.y;
      const angleMagToCoil = Math.atan2(dy, dx);
      const angleCoilToMag = angleMagToCoil + Math.PI;
      const midX = (magPt.x + coilPt.x) * 0.5;
      const midY = (magPt.y + coilPt.y) * 0.5;
      const halfLen = arrowLen * 0.5;

      if (isRepel) {
        const offsetAlong = 8 + halfLen * 0.52;
        const p1x = midX - Math.cos(angleMagToCoil) * offsetAlong;
        const p1y = midY - Math.sin(angleMagToCoil) * offsetAlong + 15;
        const p2x = midX + Math.cos(angleMagToCoil) * offsetAlong;
        const p2y = midY + Math.sin(angleMagToCoil) * offsetAlong - 15;
        drawSingleGlossyGreenArrow(p1x, p1y, angleCoilToMag, arrowLen);
        drawSingleGlossyGreenArrow(p2x, p2y, angleMagToCoil, arrowLen);
      } else {
        const p1x = magPt.x + Math.cos(angleMagToCoil) * (4 + halfLen * 0.55);
        const p1y = magPt.y + Math.sin(angleMagToCoil) * (4 + halfLen * 0.55) + 13;
        const p2x = coilPt.x - Math.cos(angleMagToCoil) * (4 + halfLen * 0.55);
        const p2y = coilPt.y - Math.sin(angleMagToCoil) * (4 + halfLen * 0.55) - 13;
        drawSingleGlossyGreenArrow(p1x, p1y, angleMagToCoil, arrowLen);
        drawSingleGlossyGreenArrow(p2x, p2y, angleCoilToMag, arrowLen);
      }
    }

    function drawSingleGlossyGreenArrow(x, y, angleRad, arrowLen) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angleRad);
      const headLen = 19;
      const headHalfW = 16.5;
      const shaftHalfW = 8.2;
      const halfTotal = arrowLen * 0.5;
      const tipX = halfTotal;
      const neckX = tipX - headLen;
      const tailX = -halfTotal;

      ctx.beginPath();
      ctx.moveTo(tipX, 0);
      ctx.lineTo(neckX, -headHalfW);
      ctx.lineTo(neckX, -shaftHalfW);
      ctx.lineTo(tailX, -shaftHalfW);
      ctx.lineTo(tailX, shaftHalfW);
      ctx.lineTo(neckX, shaftHalfW);
      ctx.lineTo(neckX, headHalfW);
      ctx.closePath();
      ctx.fillStyle = '#8CE026';
      ctx.fill();
      ctx.lineWidth = 2.8;
      ctx.strokeStyle = '#4E8F10';
      ctx.lineJoin = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(tipX - 6, -2);
      ctx.lineTo(neckX + 3, -headHalfW + 6);
      ctx.lineWidth = 2.3;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    /* 교과서 & 참고 그림(오른손 손등 / 손바닥 감아쥐기)을 정확히 반영한 오른손 법칙 오버레이 */
    function drawTextbookRightHandOverlay(phys) {
      const { endAPole } = phys;
      if (endAPole === 0) return;

      const cosA = Math.cos(state.coilAngle);
      const sinA = Math.sin(state.coilAngle);
      const uprightAngle = cosA >= 0 ? Math.atan2(sinA, cosA) : Math.atan2(-sinA, -cosA);
      const nPoleOnLeft = (endAPole * (cosA >= 0 ? 1 : -1)) > 0;

      ctx.save();
      ctx.rotate(uprightAngle);

      const skinFill = 'rgba(248, 212, 174, 0.88)';
      const nailFill = 'rgba(255, 239, 224, 0.96)';
      const outlineColor = '#7C5A3F';

      if (nPoleOnLeft) {
        /* 1) N극이 왼쪽일 때 (앞면 전류 ↑) : 오른손 손등이 보이며 네 손가락이 위로 감아쥐고 엄지가 왼쪽(N극)을 가리키는 모양 */
        ctx.save();
        ctx.fillStyle = skinFill;
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 3.0;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(-26, 178);
        ctx.lineTo(-26, 98);
        ctx.quadraticCurveTo(-52, 66, -86, 48);
        ctx.lineTo(-148, 32);
        ctx.quadraticCurveTo(-176, 26, -178, 12);
        ctx.quadraticCurveTo(-176, -4, -144, -2);
        ctx.lineTo(-76, 8);
        ctx.quadraticCurveTo(-56, 10, -52, -16);
        ctx.lineTo(-52, -74);
        ctx.quadraticCurveTo(-52, -96, -30, -96);
        ctx.quadraticCurveTo(-10, -96, -8, -78);
        ctx.quadraticCurveTo(-6, -104, 16, -104);
        ctx.quadraticCurveTo(38, -104, 40, -80);
        ctx.quadraticCurveTo(42, -98, 62, -98);
        ctx.quadraticCurveTo(82, -98, 84, -74);
        ctx.quadraticCurveTo(86, -88, 104, -88);
        ctx.quadraticCurveTo(124, -88, 124, -62);
        ctx.lineTo(124, 24);
        ctx.quadraticCurveTo(124, 82, 74, 126);
        ctx.lineTo(68, 178);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        /* 손가락 사이 구분선 */
        ctx.beginPath();
        ctx.moveTo(-8, -78); ctx.lineTo(-8, -12);
        ctx.moveTo(40, -80); ctx.lineTo(40, -12);
        ctx.moveTo(84, -74); ctx.lineTo(84, -8);
        ctx.stroke();

        /* 엄지 손톱 */
        ctx.beginPath();
        ctx.ellipse(-162, 12, 8, 6, 0.08, 0, Math.PI * 2);
        ctx.fillStyle = nailFill;
        ctx.fill();
        ctx.stroke();

        /* 자기장(N극) 방향 및 전류 방향 안내 화살표 */
        drawHandGuideArrow(-62, 24, -138, 16, '자기장의 방향 (N극)', -95, 52);
        drawHandCurlArrow(36, -65, 36, -128, '전류의 방향');
        ctx.restore();
      } else {
        /* 2) N극이 오른쪽일 때 (앞면 전류 ↓) : 오른손이 코일 뒤에서 감아쥐어 손바닥이 보이고 위쪽에 네 손가락 끝(손톱 4개)이 내려오며 엄지가 오른쪽(N극)을 가리키는 모양 */
        ctx.save();
        ctx.fillStyle = skinFill;
        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 3.0;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        /* 손바닥과 오른쪽 엄지 윤곽 */
        ctx.beginPath();
        ctx.moveTo(-64, 178);
        ctx.lineTo(-68, 118);
        ctx.quadraticCurveTo(-112, 72, -112, 12);
        ctx.lineTo(-112, -58);
        ctx.lineTo(64, -58);
        ctx.lineTo(64, -6);
        ctx.quadraticCurveTo(72, 10, 96, 4);
        ctx.lineTo(152, -6);
        ctx.quadraticCurveTo(182, -8, 184, 8);
        ctx.quadraticCurveTo(182, 24, 152, 30);
        ctx.lineTo(92, 48);
        ctx.quadraticCurveTo(56, 66, 32, 104);
        ctx.lineTo(32, 178);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        /* 코일 위쪽 모서리를 감싸 쥐며 내려오는 네 손가락 끝 마디와 손톱 4개 */
        const fingerCenters = [-88, -42, 4, 48];
        fingerCenters.forEach((fx, i) => {
          const topY = -102 - (i === 1 || i === 2 ? 6 : 0);
          const botY = -44;
          ctx.beginPath();
          ctx.roundRect(fx - 21, topY, 42, botY - topY, 16);
          ctx.fillStyle = skinFill;
          ctx.fill();
          ctx.stroke();

          /* 손톱 표현 */
          ctx.beginPath();
          ctx.roundRect(fx - 12, botY - 22, 24, 15, 6);
          ctx.fillStyle = nailFill;
          ctx.fill();
          ctx.stroke();
        });

        /* 엄지 손톱 */
        ctx.beginPath();
        ctx.ellipse(168, 10, 8, 6, -0.08, 0, Math.PI * 2);
        ctx.fillStyle = nailFill;
        ctx.fill();
        ctx.stroke();

        /* 자기장(N극) 방향 및 전류 방향 안내 화살표 */
        drawHandGuideArrow(62, 24, 138, 12, '자기장의 방향 (N극)', 95, 54);
        drawHandCurlArrow(-20, -124, -20, -58, '전류의 방향');
        ctx.restore();
      }

      ctx.restore();
    }

    function drawHandGuideArrow(x1, y1, x2, y2, labelText, lx, ly) {
      ctx.save();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = 'rgba(71, 85, 105, 0.78)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.translate(x2, y2);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-8, -8);
      ctx.lineTo(-8, 8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(71, 85, 105, 0.85)';
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.font = '800 14px "Pretendard", sans-serif';
      ctx.fillStyle = '#334155';
      ctx.textAlign = 'center';
      ctx.fillText(labelText, lx, ly);
      ctx.restore();
    }

    function drawHandCurlArrow(x1, y1, x2, y2, labelText) {
      ctx.save();
      ctx.strokeStyle = 'rgba(225, 29, 72, 0.65)';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.translate(x2, y2);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(7, 0);
      ctx.lineTo(-7, -7);
      ctx.lineTo(-7, 7);
      ctx.closePath();
      ctx.fillStyle = 'rgba(225, 29, 72, 0.78)';
      ctx.fill();
      ctx.restore();

      ctx.font = '800 14px "Pretendard", sans-serif';
      ctx.fillStyle = '#be123c';
      ctx.textAlign = 'left';
      ctx.fillText(labelText, Math.max(x1, x2) + 18, Math.min(y1, y2) + 8);
      ctx.restore();
    }

    function drawYellowStar(cx, cy, r, n) {
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 2 * n; i++) {
        const l = i % 2 === 0 ? r : r * 0.45;
        const a = (i * Math.PI) / n - Math.PI / 2;
        const x = cx + Math.cos(a) * l;
        const y = cy + Math.sin(a) * l;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#FFEE00'; ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = '#D97706'; ctx.stroke();
      ctx.restore();
    }

    function drawTextbookPinkCenterArrow(cx, cy, angleRad) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angleRad);
      ctx.beginPath();
      ctx.moveTo(38, 0);
      ctx.lineTo(12, -22);
      ctx.lineTo(12, -10);
      ctx.lineTo(-38, -10);
      ctx.lineTo(-38, 10);
      ctx.lineTo(12, 10);
      ctx.lineTo(12, 22);
      ctx.closePath();
      ctx.fillStyle = '#F43F5E'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#881337'; ctx.lineJoin = 'round'; ctx.stroke();
      ctx.restore();
    }

    function drawTextbookCallouts() {
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2.0;

      /* 왼쪽 자석 지시선 */
      ctx.beginPath(); ctx.moveTo(-352, -78); ctx.lineTo(-295, -78); ctx.stroke();
      ctx.font = '800 18px "Pretendard", sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText('자석', -360, -78);

      /* 오른쪽 자석 지시선 */
      ctx.beginPath(); ctx.moveTo(295, -78); ctx.lineTo(352, -78); ctx.stroke();
      ctx.textAlign = 'left';
      ctx.fillText('자석', 360, -78);

      /* 코일 지시선 */
      const cosA = Math.cos(state.coilAngle);
      const sinA = Math.sin(state.coilAngle);
      const starLocalX = -152 + 22;
      const starLocalY = -84 + 22;
      const sx = starLocalX * cosA - starLocalY * sinA;
      const sy = starLocalX * sinA + starLocalY * cosA;
      const labelX = sx - 44;
      const labelY = sy - 36;

      ctx.beginPath();
      ctx.moveTo(sx - 8, sy - 6);
      ctx.lineTo(labelX, labelY);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText('코일', labelX - 4, labelY + 4);
      ctx.restore();
    }

    // ================= 5. 조작 인터랙션 및 상태 제어 =================
    function togglePlayPause() {
      state.isPlaying = !state.isPlaying;
      if (state.isPlaying && (!state.switchOn || state.currentLevel <= 0.01)) {
        state.switchOn = true;
        state.currentLevel = 1;
        state.currentAmp = LEVEL_TO_AMP[1];
      }
      syncPowerSwitchUI();
      updatePlayPauseUI();
    }

    function updatePlayPauseUI() {
      const topBtn = document.getElementById('panelPlayPauseBtn');
      const topIcon = document.getElementById('panelPlayPauseIcon');
      const topText = document.getElementById('panelPlayPauseText');
      const btmBtn = document.getElementById('btmPlayPauseBtn');
      const btmIcon = document.getElementById('btmPlayPauseIcon');
      const btmText = document.getElementById('btmPlayPauseText');

      if (state.isPlaying) {
        if (topBtn) {
          topBtn.className = "w-full py-1.5 px-3 rounded-xl font-black text-xs border-2 border-slate-900 bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm flex items-center justify-center gap-1.5";
          topIcon.textContent = '⏸️';
          topText.textContent = '일시정지';
        }
        if (btmBtn) {
          btmBtn.className = "px-4 py-1 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 border-2 border-slate-900 font-black text-xs shadow-sm flex items-center gap-1.5";
          btmIcon.textContent = '⏸️';
          btmText.textContent = '일시정지';
        }
      } else {
        if (topBtn) {
          topBtn.className = "w-full py-1.5 px-3 rounded-xl font-black text-xs border-2 border-slate-900 bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm flex items-center justify-center gap-1.5 play-resume-pulse";
          topIcon.textContent = '▶️';
          topText.textContent = '실행';
        }
        if (btmBtn) {
          btmBtn.className = "px-4 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-slate-900 font-black text-xs shadow-sm flex items-center gap-1.5 play-resume-pulse";
          btmIcon.textContent = '▶️';
          btmText.textContent = '실행';
        }
      }
    }

    function togglePowerSwitch() {
      state.switchOn = !state.switchOn;
      if (state.switchOn && state.currentLevel <= 0.01) {
        state.currentLevel = 1;
        state.currentAmp = LEVEL_TO_AMP[1];
      } else if (!state.switchOn) {
        state.currentLevel = 0;
        state.currentAmp = 0;
      }
      syncPowerSwitchUI();
    }

    function syncPowerSwitchUI() {
      const blade = document.getElementById('svgSwitchBlade');
      const label = document.getElementById('svgSwitchLabel');
      const ampSlider = document.getElementById('ampSlider');
      const badge = document.getElementById('ampReadoutBadge');

      if (ampSlider && document.activeElement !== ampSlider) {
        ampSlider.value = state.currentLevel;
      }
      if (badge) {
        const nearestIdx = Math.round(state.currentLevel);
        badge.textContent = state.currentLevel <= 0.02 ? '0 OFF' : (LEVEL_LABELS[nearestIdx] || '1 미약');
        badge.className = state.currentLevel <= 0.02
          ? "px-2 py-0.5 rounded-full bg-slate-200 border border-slate-900 text-slate-900 font-black text-[10px] shrink-0"
          : "px-2 py-0.5 rounded-full bg-yellow-300 border border-slate-900 text-slate-950 font-black text-[10px] shrink-0";
      }

      if (state.switchOn && state.currentLevel > 0.01) {
        if (blade) { blade.setAttribute('x2', '122'); blade.setAttribute('y2', '68'); blade.setAttribute('stroke', '#16a34a'); }
        if (label) { label.textContent = '스위치 닫힘 (전류 ON)'; label.setAttribute('fill', '#16a34a'); }
      } else {
        if (blade) { blade.setAttribute('x2', '122'); blade.setAttribute('y2', '53'); blade.setAttribute('stroke', '#dc2626'); }
        if (label) { label.textContent = '스위치 열림 (전류 OFF)'; label.setAttribute('fill', '#dc2626'); }
      }
    }

    /* 끊김 없이 부드럽게 전류 세기를 보간하는 슬라이더 핸들러 */
    function setCurrentLevel(val) {
      const num = Math.max(0, Math.min(5, parseFloat(val) || 0));
      state.currentLevel = num;
      if (num <= 0.02) {
        state.currentLevel = 0;
        state.switchOn = false;
        state.currentAmp = 0;
      } else {
        state.switchOn = true;
        const low = Math.floor(num);
        const high = Math.min(5, Math.ceil(num));
        const frac = num - low;
        const ampLow = LEVEL_TO_AMP[low] !== undefined ? LEVEL_TO_AMP[low] : 0;
        const ampHigh = LEVEL_TO_AMP[high] !== undefined ? LEVEL_TO_AMP[high] : 28.0;
        state.currentAmp = ampLow + (ampHigh - ampLow) * frac;
      }
      syncPowerSwitchUI();
    }

    function flipCurrentDirection() {
      state.batteryPolarity *= -1;
      const nub = document.getElementById('svgBatNub');
      const leftSign = document.getElementById('svgBatLeftSign');
      const rightSign = document.getElementById('svgBatRightSign');
      if (state.batteryPolarity > 0) {
        if (nub) nub.setAttribute('x', '170');
        if (leftSign) leftSign.textContent = '+';
        if (rightSign) rightSign.textContent = '-';
      } else {
        if (nub) nub.setAttribute('x', '223');
        if (leftSign) leftSign.textContent = '-';
        if (rightSign) rightSign.textContent = '+';
      }
    }

    function flipMagnetPoles() {
      state.statorPolarity *= -1;
      const leftMag = document.getElementById('miniLeftMag');
      const rightMag = document.getElementById('miniRightMag');
      if (state.statorPolarity > 0) {
        if (leftMag) leftMag.textContent = 'N';
        if (rightMag) rightMag.textContent = 'S';
      } else {
        if (leftMag) leftMag.textContent = 'S';
        if (rightMag) rightMag.textContent = 'N';
      }
    }

    function setCommutatorMode(autoFlag) {
      state.commutatorAutoFlip = autoFlag;
      const onPill = document.getElementById('commOnPill');
      const offPill = document.getElementById('commOffPill');
      if (autoFlag) {
        if (onPill) onPill.className = "px-1.5 py-0.5 rounded bg-slate-900 text-yellow-300";
        if (offPill) offPill.className = "px-1.5 py-0.5 rounded text-slate-400";
      } else {
        if (onPill) onPill.className = "px-1.5 py-0.5 rounded text-slate-400";
        if (offPill) offPill.className = "px-1.5 py-0.5 rounded bg-slate-900 text-yellow-300";
      }
    }

    function setCoilAngleFromSlider(val) {
      state.isPlaying = false;
      updatePlayPauseUI();
      const deg = parseFloat(val);
      state.coilAngle = (deg * Math.PI) / 180;
    }

    function rotateCoilByStep(deltaDeg) {
      state.isPlaying = false;
      updatePlayPauseUI();
      let deg = (state.coilAngle * 180) / Math.PI + deltaDeg;
      deg = (deg % 360 + 360) % 360;
      state.coilAngle = (deg * Math.PI) / 180;
    }

    function toggleRightHandOverlay(isChecked) {
      state.showRightHand = isChecked;
    }

    function toggleSettingsPanel(forceState) {
      const panel = document.getElementById('settingsPanel');
      const btnText = document.getElementById('headerSettingsBtnText');
      if (!panel) return;
      const shouldOpen = forceState !== undefined ? forceState : panel.classList.contains('hidden');
      if (shouldOpen) {
        panel.classList.remove('hidden');
        if (btnText) btnText.textContent = '설정창 닫기 ✕';
      } else {
        panel.classList.add('hidden');
        if (btnText) btnText.textContent = '설정창 열기 ⚙️';
      }
      setTimeout(resizeCanvas, 50);
    }

    // ================= 6. 애니메이션 루프 =================
    let lastTime = performance.now();
    function mainLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      const phys = updatePhysics(dt);
      renderTextbookMotor(phys);

      requestAnimationFrame(mainLoop);
    }

    window.onload = function() {
      resizeCanvas();
      syncPowerSwitchUI();
      updatePlayPauseUI();
      setCommutatorMode(true);
      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
</html>
